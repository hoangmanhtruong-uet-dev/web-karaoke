name: Next app security baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, unit tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      SECURITY_EVENT_HASH_SECRET: ci-only-security-hash-secret-at-least-32-characters
    defaults:
      run:
        working-directory: next-app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - run: npm ci
      - name: Generate Prisma client without connecting to a database
        run: npm exec -- prisma generate
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/web_karaoke_ci_test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build

  integration:
    name: PostgreSQL integration (two clean runs)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: web_karaoke_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d web_karaoke_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/web_karaoke_ci_test
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      SECURITY_EVENT_HASH_SECRET: ci-only-security-hash-secret-at-least-32-characters
    defaults:
      run:
        working-directory: next-app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - run: npm ci
      - name: Guard isolated CI database
        run: npm run test:db:guard
      - name: Validate Prisma schema
        run: npm exec -- prisma validate
      - name: Generate Prisma client
        run: npm exec -- prisma generate
      - name: Apply all migrations to the empty CI database
        run: npm exec -- prisma migrate deploy
      - name: Integration suite - first run
        run: npm run test:integration:ci
        timeout-minutes: 7
      - name: Reset the guarded CI database and reapply migrations
        run: npm run test:db:reset:ci
      - name: Integration suite - second run
        run: npm run test:integration:ci
        timeout-minutes: 7
      - name: Verify migrated database metadata and report DB-001
        run: npm run test:db:metadata
