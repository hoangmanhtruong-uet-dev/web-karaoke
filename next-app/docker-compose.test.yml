services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: web_karaoke_test
      POSTGRES_PASSWORD: local_test_password
      POSTGRES_DB: web_karaoke_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web_karaoke_test -d web_karaoke_test"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_test_data:
