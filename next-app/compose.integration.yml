services:
  postgres-integration:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: web_karaoke_test
      POSTGRES_USER: karaoke_test_runner
      POSTGRES_PASSWORD: ${INTEGRATION_POSTGRES_PASSWORD:?INTEGRATION_POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${INTEGRATION_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U karaoke_test_runner -d web_karaoke_test"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data
    restart: "no"
